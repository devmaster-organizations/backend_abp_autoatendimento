services:

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - .:/app
    command: npm run start


  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autoatendimento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data